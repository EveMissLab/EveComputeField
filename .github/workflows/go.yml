name: Reference Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

      - name: M1 loopback service and restart smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-m1-linux.sh

      - name: M2 local resize + named workload + restart smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-m2-linux.sh

      - name: M3 local fluid field integration smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-m3-fluid-linux.sh

      - name: Install Node for deterministic SVG-fluid math tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: SVG-fluid numerical regression tests (no browser dependency)
        run: node research/run-tests.mjs

      - name: Evidence integrity regression tests
        run: node --test scripts/check-evidence-manifest.test.mjs

      - name: Verify committed evidence and checkout bytes
        run: node scripts/check-evidence-manifest.mjs --ref HEAD --check-worktree

      - name: Source-tree manifest regression tests
        run: node --test scripts/check-source-manifest.test.mjs

      - name: Verify current source-tree Git bytes
        run: node scripts/check-source-manifest.mjs --ref HEAD --check-worktree

      - name: M4 local matched-state benchmark smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node research/m4/benchmark.mjs --units 360 --cells 512 --workers 2 --pairs 2 --steps 4 --calls 8 > m4-smoke.json
          node -e "const r=require('./m4-smoke.json'); if (!r.reorganization_receipt.physical_state_unchanged || r.measurement.arms.some(a=>a.pairs.some(p=>!p.identical_state)))process.exit(1)"

      - name: Cross-language numerical parity (Go versus browser JavaScript)
        shell: bash
        run: |
          go run ./cmd/evefield tool fluid < examples/fluid/scenario.json > fluid-result.json
          node scripts/check-fluid-parity.cjs fluid-result.json
