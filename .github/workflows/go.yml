name: Reference Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

      - name: M1 loopback service and restart smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-m1-linux.sh

      - name: M2 local resize + named workload + restart smoke (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-m2-linux.sh
